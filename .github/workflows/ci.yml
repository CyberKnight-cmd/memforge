name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: find src tests -name '*.[ch]' -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Layering
        run: scripts/check_layers.sh

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (dev, sanitizers on)
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
      # Still to add as the code lands: clang-tidy, the determinism double-run diff (NFR-1),
      # and the benchmark smoke run.
