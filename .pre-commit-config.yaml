# Runs on `git commit` once installed (`pre-commit install`), and in CI on every PR.
# The clang-format version is pinned here so every machine and CI format identically.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^web/tsconfig.*\.json$  # TypeScript configs are JSONC (comments allowed)
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c]
        exclude: ^third_party/

  - repo: local
    hooks:
      - id: check-layers
        name: layering and core purity
        entry: scripts/check_layers.sh
        language: script
        pass_filenames: false
        files: ^(src/|scripts/check_layers\.sh$)
